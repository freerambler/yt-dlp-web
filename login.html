<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YT Downloader — Вход</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0f0f13; color: #e0e0e0; font-family: 'Segoe UI', sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  .card { background: #1a1a24; border: 1px solid #2a2a3a; border-radius: 16px; padding: 40px; width: 100%; max-width: 380px; }
  .logo { display: flex; align-items: center; gap: 12px; margin-bottom: 32px; justify-content: center; }
  .logo svg { color: #ff0000; }
  .logo h1 { font-size: 1.4rem; color: #fff; }
  input { width: 100%; background: #0f0f18; border: 1px solid #333; border-radius: 8px; padding: 12px 16px; color: #fff; font-size: 1rem; outline: none; margin-bottom: 14px; transition: border 0.2s; }
  input:focus { border-color: #ff0000; }
  button { width: 100%; background: #ff0000; color: #fff; border: none; border-radius: 8px; padding: 13px; font-size: 1rem; cursor: pointer; transition: background 0.2s; margin-top: 4px; }
  button:hover { background: #cc0000; }
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <svg width="32" height="32" viewBox="0 0 24 24" fill="currentColor"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>
    <h1>YT Downloader</h1>
  </div>
  <form method="post" action="/login">
    <input type="text" name="username" placeholder="Логин" autofocus />
    <input type="password" name="password" placeholder="Пароль" />
    <button type="submit">Войти</button>
  </form>
</div>
</body>
</html>
